<title>舞蹈上课记录</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#faf7f5;--card:#fff;--text:#1c1917;--muted:#79716b;--line:#e8e3df;
  --accent:#c94f70;--accent-soft:#fce9ee;--star:#e8a33d;--radius:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17130f;--card:#231e1a;--text:#f5f1ec;--muted:#a9a19a;--line:#342f29;
  --accent:#ef7593;--accent-soft:#3b2028;--star:#f2b94f;}}
:root[data-theme="dark"]{
  --bg:#17130f;--card:#231e1a;--text:#f5f1ec;--muted:#a9a19a;--line:#342f29;
  --accent:#ef7593;--accent-soft:#3b2028;--star:#f2b94f;}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:80px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line);padding:12px 16px 10px}
h1{font-size:18px;margin:0;font-weight:650}
.sub{font-size:12px;color:var(--muted);margin-top:2px}
main{padding:14px 14px 20px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
input,select,textarea{width:100%;max-width:100%;padding:0 11px;font-size:16px;font-family:inherit;
  height:46px;line-height:44px;-webkit-appearance:none;appearance:none;
  border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);
  text-align:left;vertical-align:middle}
input[type=date]{min-height:46px;display:block}
textarea{height:auto;min-height:60px;padding:10px 11px;line-height:1.5;resize:vertical}
select{padding-right:30px}
.sel{position:relative}
.sel::after{content:"▾";position:absolute;right:11px;top:0;line-height:46px;
  color:var(--muted);pointer-events:none;font-size:13px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.row{display:flex;gap:10px;align-items:flex-start}.row>*{flex:1;min-width:0}
.field{margin-bottom:12px}
button{font-family:inherit;font-size:15px;cursor:pointer;border:none;background:none;color:inherit}
.btn{background:var(--accent);color:#fff;padding:12px;border-radius:11px;width:100%;font-weight:650}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:500}
.btn.sm{padding:7px 11px;width:auto;font-size:13px;border-radius:9px}
.stars{display:flex;gap:9px}
.stars button{font-size:30px;line-height:1;color:var(--line);padding:0}
.stars button.on{color:var(--star)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--card);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;padding:10px 4px 12px;font-size:11px;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button.on{color:var(--accent);font-weight:650}
.tabs .ic{font-size:19px;line-height:1}
.mon{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em;
  padding:12px 0 5px;border-bottom:1px solid var(--line)}
.rec{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.rec .d{flex:0 0 40px;text-align:center;padding-top:1px}
.rec .d b{display:block;font-size:19px;line-height:1.05;font-weight:650}
.rec .d span{font-size:10px;color:var(--muted)}
.rec .m{flex:1;min-width:0}
.rec .t{font-weight:650;font-size:15px}
.rec .meta{font-size:12px;color:var(--muted);margin-top:2px;word-break:break-word}
.rec .st{font-size:12px;color:var(--star);letter-spacing:1px}
.pill.no{background:transparent;color:var(--muted);padding:2px 0;margin-right:7px}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--accent-soft);
  color:var(--accent);font-size:11px;font-weight:650;margin-right:5px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:11px 4px;text-align:center}
.kpi b{display:block;font-size:19px;font-weight:700;line-height:1.2}
.kpi span{font-size:10px;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:10px}
.seg button{flex:1;padding:8px 2px;font-size:13px;color:var(--muted);background:var(--card)}
.seg button.on{background:var(--accent);color:#fff;font-weight:650}
.tbl{width:100%;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:86px}
th{font-size:11px;color:var(--muted);font-weight:600;cursor:pointer;user-select:none}
th.act{color:var(--accent)}
.bar{height:4px;background:var(--accent);border-radius:2px;margin-top:4px;min-width:2px}
.empty{text-align:center;color:var(--muted);padding:32px 14px;font-size:14px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.hd h2{font-size:14px;margin:0;font-weight:650}
.note{font-size:12px;color:var(--muted);line-height:1.6}
.more{text-align:center;padding:12px 0 2px}
dialog{border:none;border-radius:16px;padding:0;background:var(--card);color:var(--text);max-width:92vw;width:360px}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{padding:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:var(--text);
  color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;z-index:99;opacity:0;
  transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:8px 13px;border:1px solid var(--line);border-radius:99px;font-size:14px;
  background:var(--bg);color:var(--text);line-height:1.2}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:650}
.chip.add{color:var(--muted);border-style:dashed}
.orow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.orow span{flex:1;min-width:0;font-size:14px}
.orow small{color:var(--muted);font-size:12px}
.obtn{width:34px;height:34px;flex:0 0 auto;border:1px solid var(--line);border-radius:8px;font-size:15px;color:var(--muted)}
.hidden{display:none!important}
</style>
</head>
<body>
<header>
  <h1>舞蹈上课记录</h1>
  <div class="sub" id="sub">加载中…</div>
</header>

<main>
<section id="v-list">
  <div class="card" style="padding:10px 12px">
    <div class="row" style="gap:8px;margin-bottom:8px">
      <div class="sel"><select id="f-studio"><option value="">全部舞房</option></select></div>
      <div class="sel"><select id="f-style"><option value="">全部舞种</option></select></div>
      <div class="sel"><select id="f-teacher"><option value="">全部老师</option></select></div>
    </div>
    <div class="row" style="gap:8px">
      <input id="f-kw" placeholder="搜索老师 / 备注">
      <button class="btn ghost" id="f-sort" style="flex:0 0 auto;height:46px;padding:0 12px;font-size:13px;width:auto">最新在前 ↓</button>
    </div>
  </div>
  <div class="card" id="listbox"></div>
</section>

<section id="v-add" class="hidden">
  <div class="card">
    <div class="row">
      <div class="field"><label>上课时间</label><input type="date" id="i-date"></div>
      <div class="field"><label>周数</label><input id="i-week" placeholder="第N周"></div>
    </div>
    <div class="field"><label>舞房</label><div class="chips" id="c-studio"></div></div>
    <div class="field"><label>舞种</label><div class="chips" id="c-style"></div></div>
    <div class="field"><label>老师</label><div class="chips" id="c-teacher"></div></div>
    <div class="field"><label>难度</label><div class="stars" id="i-stars"></div></div>
    <div class="field"><label>备注</label><textarea id="i-note" placeholder="小班 / 曲目 / 感受…"></textarea></div>
    <button class="btn" id="save">保存记录</button>
    <button class="btn ghost" id="cancel" style="margin-top:8px" hidden>取消编辑</button>
  </div>
</section>

<section id="v-stats" class="hidden">
  <div class="seg" id="range">
    <button data-r="30">近30天</button>
    <button data-r="90">近3月</button>
    <button data-r="365">近1年</button>
    <button data-r="0" class="on">全部</button>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="card">
    <div class="seg" id="dim" style="margin-bottom:12px">
      <button data-d="teacher" class="on">老师</button>
      <button data-d="style">舞种</button>
      <button data-d="studio">舞房</button>
    </div>
    <div class="tbl"><table id="agg"></table></div>
    <div class="note" style="margin-top:10px">点表头切换排序：课数 / 平均难度 / 最近一次。</div>
  </div>
  <div class="card">
    <div class="seg" id="gran">
      <button data-g="month" class="on">按月分布</button>
      <button data-g="week">按周分布</button>
    </div>
    <div class="tbl"><table id="months"></table></div>
  </div>
</section>

<section id="v-set" class="hidden">
  <div class="card">
    <div class="hd"><h2>数据</h2></div>
    <button class="btn ghost" id="exp">导出 CSV（按时间排序）</button>
    <div style="height:8px"></div>
    <button class="btn ghost" id="imp">导入 CSV</button>
    <input type="file" id="file" accept=".csv,text/csv" class="hidden">
    <div class="note" style="margin-top:10px">CSV 表头含：日期、舞房、舞种、老师、难度、备注（顺序不限）。导入为追加，不会覆盖现有记录。</div>
  </div>
  <div class="card">
    <div class="hd"><h2>云端同步</h2></div>
    <div class="note" id="sync-msg" style="margin-bottom:10px">未配置，数据仅存在本机</div>
    <div class="field"><label>Project URL</label><input id="sb-url" placeholder="https://xxxx.supabase.co" autocapitalize="off" autocorrect="off"></div>
    <div class="field"><label>Publishable key</label><input id="sb-key" placeholder="sb_publishable_..." autocapitalize="off" autocorrect="off"></div>
    <div class="row">
      <button class="btn" id="sb-save">保存并同步</button>
      <button class="btn ghost" id="sb-sync">立即同步</button>
    </div>
    <button class="btn ghost" id="sb-clear" style="margin-top:8px">断开云端</button>
    <button class="btn ghost" id="sb-shift" style="margin-top:8px">原始数据难度整体 +1（限一次）</button>
    <div class="note" style="margin-top:10px">密钥只存在本机浏览器，不会出现在网站文件里。</div>
  </div>
  <div class="card">
    <div class="hd"><h2>选项排序</h2></div>
    <div class="seg" id="ord-dim">
      <button data-d="teacher" class="on">老师</button>
      <button data-d="style">舞种</button>
      <button data-d="studio">舞房</button>
    </div>
    <div id="ord-list"></div>
    <div class="note" style="margin-top:8px">调整后，添加记录时按钮就按这个顺序排。</div>
  </div>
  <div class="card">
    <div class="hd"><h2>外观</h2></div>
    <div class="seg" id="theme">
      <button data-t="auto" class="on">跟随系统</button>
      <button data-t="light">浅色</button>
      <button data-t="dark">深色</button>
    </div>
  </div>
  <div class="card">
    <div class="hd"><h2>加到手机桌面</h2></div>
    <div class="note">Safari 打开本页 → 底部分享按钮 → 添加到主屏幕。<br>若没看到该选项，滚到列表最底部点「编辑操作」把它加进来。</div>
  </div>
</section>
</main>

<nav class="tabs">
  <button data-v="list" class="on"><span class="ic">📋</span>记录</button>
  <button data-v="add"><span class="ic">➕</span>添加</button>
  <button data-v="stats"><span class="ic">📊</span>统计</button>
  <button data-v="set"><span class="ic">⚙️</span>设置</button>
</nav>

<dialog id="dlg"><div class="dlg">
  <div id="dlg-body"></div>
  <div class="row" style="margin-top:14px">
    <button class="btn ghost" id="dlg-no">取消</button>
    <button class="btn" id="dlg-yes">确定</button>
  </div>
</div></dialog>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
var SEED={"S":[],"Y":[],"T":[],"R":[]};
var MAXSTAR=4, LKEY="dance_log_v3";
var DB=null, LOCAL=false, years={}, records=[], ready=false;

function $(s){return document.querySelector(s);}
function el(t,c,x){var n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n;}
function pad(n){return n<10?"0"+n:""+n;}
function today(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function stars(n){return "★".repeat(n||0)+"☆".repeat(Math.max(0,MAXSTAR-(n||0)));}
function uid(){return "r"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(function(){t.classList.remove("on");},1800);}
function yr(d){return (d||"").slice(0,4)||"other";}
var ANCHOR=Date.UTC(2025,1,17); /* 第1周起始：2025-02-17 周一 */
function weekOf(d){
  var t=Date.parse(d+"T00:00:00Z"); if(isNaN(t)) return "";
  var n=Math.floor((t-ANCHOR)/6048e5)+1;
  return n>0? "第"+n+"周" : "";
}

/* ---- 存储：按年分块，一年一个文档 ---- */
function flatten(){
  var out=[];
  Object.keys(years).forEach(function(y){
    (years[y]||[]).forEach(function(r){ if(!r.deleted) out.push(r); });
  });
  out.sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:((a.seq||0)-(b.seq||0)); });
  out.forEach(function(r,i){ r.no=i+1; });
  records=out;
}
function localSave(){ try{ localStorage.setItem(LKEY,JSON.stringify(years)); }catch(e){} }
function seedYears(){
  var y={};
  SEED.R.forEach(function(a,i){
    var r={id:"s"+i,date:a[0],studio:SEED.S[a[1]],style:SEED.Y[a[2]],
      teacher:SEED.T[a[3]],level:a[4],week:a[5],note:a[6],seq:a[7]};
    var k=yr(r.date); if(!y[k]) y[k]=[]; y[k].push(r);
  });
  return y;
}
function total(y){ var n=0; for(var k in y) n+=(y[k]||[]).length; return n; }

function initStore(){
  /* 1. 立刻渲染：本地缓存 → 没有就用内置数据 */
  var c=null;
  try{ c=localStorage.getItem(LKEY); }catch(e){}
  years = c? JSON.parse(c) : seedYears();
  ready=true; flatten(); cache(); renderAll();
  /* 2. 后台连云端，成功就同步，失败完全不影响使用 */
  syncCloud();
}
function syncCloud(){
  if(!(window.claude&&claude.use)) return;
  var done=false;
  setTimeout(function(){ if(!done) LOCAL=true; },4000);
  claude.use("db").then(function(db){
    done=true;
    if(!db){ LOCAL=true; renderAll(); return; }
    DB=db;
    try{
      DB.collection("log").onSnapshot(function(snap){
        var y={}; snap.forEach(function(doc){ var v=doc.data()||{}; y[doc.id]=v.items||[]; });
        if(total(y)>0){ years=y; flatten(); cache(); renderAll(); }
        else { Object.keys(years).forEach(function(k){ writeYear(k); }); }
      },function(){ DB=null; LOCAL=true; });
    }catch(e){ DB=null; LOCAL=true; }
  }).catch(function(){ done=true; LOCAL=true; });
}
function cache(){ try{ localStorage.setItem(LKEY,JSON.stringify(years)); }catch(e){} }
function writeYear(y){
  cache(); flatten(); renderAll();
  if(DB){
    try{ DB.collection("log").doc(y).set({items:years[y]||[]}).catch(function(){}); }catch(e){}
  }
  return true;
}
async function putRec(rec){
  var oldY=null;
  Object.keys(years).forEach(function(y){
    if((years[y]||[]).some(function(r){return r.id===rec.id;})) oldY=y;
  });
  var ny=yr(rec.date);
  if(oldY&&oldY!==ny){ years[oldY]=years[oldY].filter(function(r){return r.id!==rec.id;}); await writeYear(oldY); }
  if(!years[ny]) years[ny]=[];
  var i=years[ny].findIndex(function(r){return r.id===rec.id;});
  if(i>=0) years[ny][i]=rec; else years[ny].push(rec);
  years[ny].sort(function(a,b){return a.date<b.date?-1:1;});
  return writeYear(ny);
}
function dropRec(id){
  var y=null;
  Object.keys(years).forEach(function(k){ if((years[k]||[]).some(function(r){return r.id===id;})) y=k; });
  if(!y) return;
  years[y].forEach(function(r){ if(r.id===id){ r.deleted=1; r.updated_at=Date.now(); } });
  writeYear(y); push([{id:id,deleted:true,updated_at:Date.now()}]);
}

/* ---- 表单 ---- */
var editing=null, lvl=0;
function buildStars(){
  var b=$("#i-stars"); b.innerHTML="";
  for(var i=1;i<=MAXSTAR;i++){(function(n){
    var x=el("button",null,"★"); x.type="button";
    x.onclick=function(){ lvl=(lvl===n?0:n); paint(); };
    b.appendChild(x);
  })(i);}
  paint();
}
function paint(){ var c=$("#i-stars").children; for(var i=0;i<c.length;i++) c[i].className=(i<lvl?"on":""); }
function resetForm(){
  editing=null; lvl=0; $("#i-date").value=today(); $("#i-week").value=weekOf(today());
  pick.studio=lastVal("studio"); pick.style=""; pick.teacher="";
  renderFilters(); $("#i-note").value="";

function parseCSV(x){
  var rows=[],row=[],cur="",q=false;
  x=x.replace(/^\ufeff/,"").replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  for(var i=0;i<x.length;i++){ var c=x[i];
    if(q){ if(c==='"'){ if(x[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===","){ row.push(cur); cur=""; }
    else if(c==="\n"){ row.push(cur); rows.push(row); row=[]; cur=""; }
    else cur+=c; }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(function(r){return r.some(function(v){return (v||"").trim()!=="";});});
}
function normDate(s){
  s=(s||"").trim(); if(!s) return "";
  var m=s.match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  return m? m[1]+"-"+pad(+m[2])+"-"+pad(+m[3]) : "";
}

/* ========== 云端同步（Supabase） ========== */
var SBKEY="dance_sb_cfg", SB=null;
try{ SB=JSON.parse(localStorage.getItem(SBKEY)||"null"); }catch(e){ SB=null; }
function sbOn(){ return !!(SB&&SB.url&&SB.key); }
function sbUrl(p){ return SB.url.replace(/\/+$/,"")+"/rest/v1/"+p; }
function sbHead(extra){
  var hd={apikey:SB.key,"Content-Type":"application/json"};
  /* 新版 sb_publishable_ 密钥只走 apikey 头；旧版 anon JWT 需要 Bearer */
  if(SB.key.indexOf("sb_")!==0) hd.Authorization="Bearer "+SB.key;
  for(var k in (extra||{})) hd[k]=extra[k];
  return hd;
}
function setSync(msg){ var e=$("#sync-msg"); if(e) e.textContent=msg; }

function push(list){
  if(!sbOn()||!list||!list.length) return Promise.resolve();
  var body=list.map(function(r){
    return {id:r.id,date:r.date||null,week:r.week||"",studio:r.studio||"",style:r.style||"",
      teacher:r.teacher||"",level:r.level||0,note:r.note||"",seq:r.seq||0,
      deleted:!!r.deleted,updated_at:r.updated_at||Date.now()};
  });
  return fetch(sbUrl("classes"),{method:"POST",
    headers:sbHead({Prefer:"resolution=merge-duplicates,return=minimal"}),
    body:JSON.stringify(body)})
    .then(function(res){ if(!res.ok) return res.text().then(function(t){throw new Error(t);}); })
    .catch(function(e){ setSync("同步失败："+e.message); });
}
function pull(){
  if(!sbOn()) return Promise.reject(new Error("未配置"));
  return fetch(sbUrl("classes?select=*&limit=20000"),{headers:sbHead()})
    .then(function(res){ if(!res.ok) return res.text().then(function(t){throw new Error(t);}); return res.json(); });
}
function localMap(){
  var m={};
  Object.keys(years).forEach(function(y){ (years[y]||[]).forEach(function(r){ m[r.id]=r; }); });
  return m;
}
function syncNow(){
  if(!sbOn()){ setSync("尚未配置云端"); return; }
  setSync("同步中…");
  pull().then(function(rows){
    var lm=localMap(), merged={}, toPush=[];
    rows.forEach(function(r){ merged[r.id]=r; });
    Object.keys(lm).forEach(function(id){
      var l=lm[id], c=merged[id];
      if(!c || (l.updated_at||0)>(c.updated_at||0)){ merged[id]=l; toPush.push(l); }
    });
    var y={};
    Object.keys(merged).forEach(function(id){
      var r=merged[id]; if(!r.date) return;
      var k=yr(r.date); if(!y[k]) y[k]=[];
      y[k].push({id:r.id,date:r.date,week:r.week||"",studio:r.studio||"",style:r.style||"",
        teacher:r.teacher||"",level:r.level||0,note:r.note||"",seq:r.seq||0,
        deleted:!!r.deleted,updated_at:r.updated_at||0});
    });
    Object.keys(y).forEach(function(k){ y[k].sort(function(a,b){return a.date<b.date?-1:1;}); });
    years=y; flatten(); cache(); renderAll();
    if(toPush.length) return push(toPush).then(function(){ setSync("已同步 · 上传 "+toPush.length+" 条 · "+new Date().toLocaleTimeString()); });
    setSync("已同步 · "+new Date().toLocaleTimeString());
  }).catch(function(e){ setSync("同步失败："+e.message); });
}
function saveCfg(){
  var u=$("#sb-url").value.trim(), k=$("#sb-key").value.trim();
  if(!u||!k){ setSync("请填完整"); return; }
  if(u.indexOf("http")!==0){ u="https://"+u; }
  SB={url:u,key:k};
  try{ localStorage.setItem(SBKEY,JSON.stringify(SB)); }catch(e){}
  syncNow();
}
function clearCfg(){ SB=null; try{ localStorage.removeItem(SBKEY); }catch(e){}
  $("#sb-url").value=""; $("#sb-key").value=""; setSync("已断开云端，改为仅本地存储");
}
/* 一次性：导入的原始数据难度整体 +1（0→1,1→2,2→3,3→4） */
function shiftLegacy(){
  if(!confirm("把飞书导入的原始记录难度整体 +1？\n你自己新加的记录不受影响，且只能执行一次。")) return;
  if(!sbOn()){ doShift(false); return; }
  setSync("检查中…");
  pull().then(function(rows){
    var done=rows.some(function(r){ return r.id==="_shift_v1"; });
    if(done){ setSync("该操作已执行过，未重复应用"); toast("已执行过，跳过"); return; }
    doShift(true);
  }).catch(function(e){ setSync("检查失败："+e.message); });
}
function doShift(markCloud){
  var touched={}, changed=[], n=0;
  Object.keys(years).forEach(function(y){
    (years[y]||[]).forEach(function(r){
      if(String(r.id).charAt(0)!=="s") return;
      var v=Math.min(4,(r.level||0)+1);
      if(v!==r.level){ r.level=v; r.updated_at=Date.now(); touched[y]=1; changed.push(r); n++; }
    });
  });
  Object.keys(touched).forEach(function(y){ writeYear(y); });
  flatten(); cache(); renderAll();
  if(changed.length&&sbOn()){
    var batch=changed.slice();
    if(markCloud) batch.push({id:"_shift_v1",date:null,deleted:true,updated_at:Date.now()});
    push(batch).then(function(){ setSync("已提升 "+n+" 条并同步云端"); });
  }
  toast("已提升 "+n+" 条");
}
Array.prototype.forEach.call($("#theme").children,function(b){
  b.onclick=function(){ Array.prototype.forEach.call($("#theme").children,function(x){x.className="";});
    b.className="on"; var t=b.dataset.t;
    if(t==="auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme",t);
    try{ localStorage.setItem("dance_theme",t); }catch(e){} };
});
(function(){ var t=null; try{t=localStorage.getItem("dance_theme");}catch(e){}
  if(t&&t!=="auto"){ document.documentElement.setAttribute("data-theme",t);
    Array.prototype.forEach.call($("#theme").children,function(x){x.className=x.dataset.t===t?"on":"";}); } })();

var views={list:"#v-list",add:"#v-add",stats:"#v-stats",set:"#v-set"};
function show(v){
  Object.keys(views).forEach(function(k){ $(views[k]).classList.toggle("hidden",k!==v); });
  Array.prototype.forEach.call(document.querySelectorAll(".tabs button"),function(b){ b.className=b.dataset.v===v?"on":""; });
  if(v==="stats") renderStats();
  if(v==="set") renderOrder();
  window.scrollTo(0,0);
}
Array.prototype.forEach.call(document.querySelectorAll(".tabs button"),function(b){
  b.onclick=function(){ if(b.dataset.v==="add"&&!editing) resetForm(); show(b.dataset.v); };
});

function renderAll(){
  renderFilters(); renderList();
  if(!$("#v-stats").classList.contains("hidden")) renderStats();
  var n=records.length;
  if(!n){ $("#sub").textContent="还没有记录"+""; return; }
  $("#sub").textContent="共 "+n+" 节课 · "+records[0].date+" 至 "+records[n-1].date+"";
}
$("#sb-save").onclick=saveCfg;
$("#sb-sync").onclick=syncNow;
$("#sb-clear").onclick=clearCfg;
$("#sb-shift").onclick=shiftLegacy;
if(sbOn()){ $("#sb-url").value=SB.url; $("#sb-key").value=SB.key; }

buildStars(); resetForm(); renderAll(); initStore();
if(sbOn()) setTimeout(syncNow,300);
})();
</script>
</body>
</html>
