<meta name="description" content="Pawtoto wholesale pricing. Squishy, mochi and fidget toys stocked in Yorktown, Indiana. 30 pcs minimum, mix any SKUs.">
<style>
:root{
  --bg:#F6F3F0; --ink:#20191E; --ink-2:#524A52; --ink-3:#918893;
  --card:#FFFFFF; --line:#EBE4E9; --line-2:#F4EFF3;
  --pink:#E24B87; --mint:#1FA592; --lilac:#7C63D9; --sun:#EFA23C;
  --cream:#FBF8F4; --plum:#231A28;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
a{color:inherit}

/* ---------- hero ---------- */

.brandrow{display:flex;align-items:center;margin-bottom:24px}
.brandlogo{height:52px;width:auto;display:block}
.brandmark{width:52px;height:52px;border-radius:15px;background:linear-gradient(145deg,#FFF,#FBF3F7);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(226,75,135,.14),inset 0 1px 0 #fff;flex:0 0 auto}
.brandname{font-size:24px;font-weight:800;letter-spacing:-.035em;color:var(--ink)}
.brandtag{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--pink);border:1.4px solid var(--pink);border-radius:999px;padding:4px 11px;margin-left:2px}
.hero{padding:52px 24px 30px;max-width:1180px;margin:0 auto}
.hero h1{font-size:clamp(34px,5.2vw,60px);line-height:1.02;letter-spacing:-.04em;font-weight:800;margin:0 0 20px;max-width:16ch}
.hero h1 em{font-style:normal;color:var(--pink);position:relative;white-space:nowrap}
.hero h1 em::after{content:'';position:absolute;left:0;right:0;bottom:.06em;height:.42em;background:linear-gradient(90deg,rgba(226,75,135,.16),rgba(124,99,217,.14));border-radius:4px;z-index:-1}
.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-bottom:14px}
h1{font-size:clamp(38px,6.5vw,72px);line-height:.94;letter-spacing:-.045em;font-weight:850;margin:0 0 16px;max-width:14ch}
h1 em{font-style:normal;color:var(--pink)}
.lede{font-size:clamp(15px,1.7vw,18px);color:var(--ink-2);max-width:52ch;margin:0 0 26px}
.facts{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:32px}
.fact{background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:13px 18px;min-width:118px}
.fact b{font-size:19px;font-weight:800;letter-spacing:-.02em;display:block;color:var(--ink)}
.fact span{font-size:11px;color:var(--ink-3);letter-spacing:.02em}
.fact b{display:block;font-family:var(--mono);font-size:20px;letter-spacing:-.03em;font-weight:700}
.fact span{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:700}

/* ---------- order-size slider (signature) ---------- */
.sizer{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px 14px;box-sizing:border-box}
.sizer-top{display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.sizer-top h2{margin:0;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:800}
.sizer-read{font-family:var(--mono);font-size:14px;color:var(--ink-2)}
.sizer-read b{color:var(--ink);font-size:19px;letter-spacing:-.03em}
.slider{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:6px;background:linear-gradient(90deg,var(--pink),var(--sun) 45%,var(--mint));outline:none}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--ink);border:3px solid #fff;box-shadow:0 2px 8px rgba(27,23,38,.35);cursor:grab}
.slider::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--ink);border:3px solid #fff;cursor:grab}
.ticks{display:flex;justify-content:space-between;margin-top:8px}
.tick{font-family:var(--mono);font-size:11px;color:var(--ink-3);cursor:pointer;padding:2px 6px;border-radius:6px}
.tick:hover{background:var(--line-2);color:var(--ink)}
.tick.on{background:var(--ink);color:#fff}

/* ---------- controls ---------- */
.bar{position:sticky;top:0;z-index:30;background:rgba(243,240,246,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:11px 24px;margin-top:22px}
.bar-in{max-width:1180px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{flex:1 1 240px;min-width:0;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 15px}
.search input{border:0;background:transparent;outline:0;width:100%}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.chip:hover{border-color:var(--ink-3)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.navrow{display:flex;gap:6px;align-items:center;width:100%;overflow-x:auto;padding-bottom:2px}
.chip.grp{font-weight:800;letter-spacing:-.01em}
.chip.grp.on{background:var(--pink);border-color:var(--pink)}
.navlabel{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);font-weight:800;white-space:nowrap;flex:0 0 auto}
.resultcount{font-family:var(--mono);font-size:12px;color:var(--ink-3);margin-left:auto;white-space:nowrap}

/* ---------- grid ---------- */
main{max-width:1180px;margin:0 auto;padding:22px 24px 120px}
.seriesblock{margin-bottom:34px}
.seriestitle{display:flex;align-items:baseline;gap:10px;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.seriestitle h3{margin:0;font-size:17px;letter-spacing:-.02em;font-weight:800}
.seriestitle span{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:border-color .18s,transform .18s,box-shadow .18s}
.card:hover{border-color:var(--pink);transform:translateY(-3px);box-shadow:0 12px 28px rgba(32,25,30,.09)}
.card:hover{border-color:var(--ink-3);transform:translateY(-2px)}
.shot{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#EDE9F3}
.shotwrap{position:relative}
.shotwrap .wt{position:absolute;right:8px;bottom:8px;font-family:var(--mono);font-size:10.5px;color:#fff;background:rgba(27,23,38,.62);padding:2px 8px;border-radius:999px;backdrop-filter:blur(3px)}
.swatch{height:74px;display:flex;align-items:flex-end;justify-content:space-between;padding:10px 13px;position:relative}
.swatch .init{font-size:30px;font-weight:850;letter-spacing:-.05em;color:rgba(255,255,255,.92);line-height:1}
.swatch .wt{font-family:var(--mono);font-size:10.5px;color:rgba(255,255,255,.85);background:rgba(0,0,0,.16);padding:2px 7px;border-radius:999px}
.cbody{padding:11px 13px 13px;display:flex;flex-direction:column;gap:3px;flex:1}
.cname{font-weight:700;font-size:13.5px;letter-spacing:-.01em;line-height:1.3}
.csku{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.cprice{display:flex;align-items:baseline;gap:7px;margin-top:8px}
.cprice b{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:-.04em}
.cprice small{font-size:10.5px;color:var(--ink-3);font-family:var(--mono)}
.cmsrp{font-size:11px;color:var(--ink-3)}
.cmsrp b{color:var(--mint);font-weight:700}
.cacts{display:flex;gap:6px;margin-top:10px}
.mini{flex:1;border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px;font-size:11.5px;font-weight:700;color:var(--ink-2)}
.mini:hover{border-color:var(--ink);color:var(--ink)}
.mini.add{background:var(--ink);border-color:var(--ink);color:#fff}
.mini.add:hover{background:var(--pink);border-color:var(--pink)}
.qty{display:flex;border:1px solid var(--ink);border-radius:9px;overflow:hidden;flex:1}
.qty button{border:0;background:var(--ink);color:#fff;width:26px;padding:0;font-size:14px}
.qty input{flex:1;min-width:0;border:0;text-align:center;font-family:var(--mono);font-size:12px}
.tiers{border-top:1px solid var(--line-2);padding:9px 13px;background:#FBFAFD;display:none}
.tiers.open{display:block}
.trow{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11.5px;padding:2px 0;color:var(--ink-2)}
.trow.hit{color:var(--pink);font-weight:700}
.empty{text-align:center;padding:70px 20px;color:var(--ink-3)}
.gutter{max-width:1180px;margin:0 auto;padding:0 24px;box-sizing:border-box}
.unlockbar{background:linear-gradient(105deg,#2E2440,#1B1726);color:#fff;border-radius:var(--r);padding:20px 24px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;box-sizing:border-box;box-shadow:0 6px 24px rgba(27,23,38,.16)}
.unlockbar .ubtext{flex:1 1 300px;min-width:0}
.unlockbar h3{margin:0;font-size:17px;letter-spacing:-.02em;font-weight:800;color:#fff}
.unlockbar p{margin:4px 0 0;font-size:12.5px;color:#B4ADC6;line-height:1.5;max-width:48ch}
.unlockform{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.unlockform input{border:1px solid #514873;background:#120E1C;color:#fff;border-radius:999px;padding:10px 18px;outline:0;width:190px;font-family:var(--mono);font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.unlockform input::placeholder{color:#6F6790;letter-spacing:.1em}
.unlockform input:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(228,72,127,.22)}
.unlockform button{border:0;background:var(--pink);color:#fff;border-radius:999px;padding:10px 22px;font-weight:700;font-size:13px;white-space:nowrap}
.unlockform button:hover{background:#cc3a6f}
.unlockform button.ghost{background:transparent;border:1px solid #514873;color:#D6D1E4}
.unlockform button.ghost:hover{border-color:#fff;background:rgba(255,255,255,.06)}
.unlockmsg{width:100%;font-size:12px;color:#F7A8C2;margin-top:2px}
.unlocked{background:#E3F3EE;border:1px solid #BCD9D2;color:#0B4B43;border-radius:var(--r);padding:11px 18px;font-size:12.5px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;box-sizing:border-box}
.unlocked button{margin-left:auto;border:1px solid #9BC7BC;background:transparent;color:#0B4B43;border-radius:999px;padding:5px 14px;font-size:11.5px;font-weight:600}
.unlocked button:hover{background:#D3EAE3}
.locked{display:flex;align-items:baseline;gap:6px;margin-top:8px;color:var(--ink-3);font-size:12px}
.locked b{font-size:13px;color:var(--lilac);font-weight:700}

/* ---------- quote dock ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--ink);color:#fff;transform:translateY(110%);transition:transform .25s cubic-bezier(.2,.7,.3,1)}
.dock.up{transform:none}
.dock-in{max-width:1180px;margin:0 auto;padding:13px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.dock-sum{font-family:var(--mono);font-size:13px}
.dock-sum b{font-size:19px;letter-spacing:-.03em}
.dock-sum span{color:#A9A3BE}
.dock-acts{margin-left:auto;display:flex;gap:8px}
.dock-acts button{border:1px solid #4A4360;background:transparent;color:#fff;border-radius:999px;padding:9px 18px;font-size:12.5px;font-weight:700}
.dock-acts button.primary{background:var(--pink);border-color:var(--pink)}
.dock-acts button:hover{border-color:#fff}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(27,23,38,.5);display:none;justify-content:center;align-items:flex-end}
.sheet.open{display:flex}
.sheet-in{background:var(--bg);width:100%;max-width:680px;max-height:86vh;border-radius:var(--r) var(--r) 0 0;display:flex;flex-direction:column}
.sheet-in header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.sheet-in header h4{margin:0;font-size:17px;letter-spacing:-.02em}
.sheet-body{overflow-y:auto;padding:6px 20px 16px}
.qline{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-2);align-items:center}
.qline .qn{font-weight:700;font-size:13px}
.qline .qm{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.qline .qv{font-family:var(--mono);font-weight:700;white-space:nowrap}
.sheet-foot{padding:14px 20px;border-top:1px solid var(--line);background:#fff}
.big{display:flex;justify-content:space-between;font-family:var(--mono);font-size:16px;font-weight:700;margin-bottom:10px}
.gobtn{width:100%;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:13px;font-size:14px;font-weight:800}
.gobtn:hover{background:var(--pink)}
.hintline{font-size:11.5px;color:var(--ink-3);margin-top:9px;line-height:1.5}

/* ---------- terms ---------- */
.terms{max-width:1180px;margin:0 auto;padding:0 24px 40px;box-sizing:border-box}
.termsgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px}
.tcard h5{margin:0 0 5px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:800}
.tcard p{margin:0;font-size:13px;color:var(--ink-2);line-height:1.55}
.foot{max-width:1180px;margin:0 auto;padding:0 24px 60px;font-size:11.5px;color:var(--ink-3);line-height:1.7}
.stale{background:#FDF0D8;border:1px solid #EBD5A4;color:#7A5306;border-radius:10px;padding:9px 13px;font-size:12px;max-width:1180px;margin:0 auto 12px}
@media (max-width:640px){
  .gutter{padding:0 18px}
  .hero{padding:30px 18px 18px} .bar{padding:10px 18px} main{padding:18px 18px 130px} .terms,.foot{padding-left:18px;padding-right:18px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:9px}
  .cprice b{font-size:19px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto}}

<script>
let C = null, snapshotUsed = false, IMG = {};
let PRICES = null, UNLOCK_MSG = '', UNLOCKING = false;
const _e=new TextEncoder();
const _u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const _b64=u8=>btoa(String.fromCharCode(...u8));
async function codeId(code){
  const h=await crypto.subtle.digest('SHA-256', _e.encode('pawtoto:'+code));
  return _b64(new Uint8Array(h)).slice(0,12);
}
async function tryUnlock(code){
  code=(code||'').trim().toUpperCase();
  if(!code) return 'Please enter your access code.';
  if(!C.locks) return 'Pricing is already open.';
  const blob=C.locks[await codeId(code)];
  if(!blob) return 'That code isn\'t recognised. Please check with your Pawtoto contact.';
  try{
    const km=await crypto.subtle.importKey('raw', _e.encode(code), 'PBKDF2', false, ['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:_u8(blob.s),iterations:150000,hash:'SHA-256'},
      km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:_u8(blob.i)}, key, _u8(blob.d));
    PRICES=JSON.parse(new TextDecoder().decode(pt));
    C.products.forEach(p=>{ const v=PRICES[p.sku]; if(v){ p.prices=v[0]; p.msrp=v[1]; } });
    try{ sessionStorage.setItem('pawtoto-code', code); }catch(e){}
    return '';
  }catch(e){ return 'That code isn\'t recognised. Please check with your Pawtoto contact.'; }
}
const isLocked = () => !!(C && C.gated && !PRICES);
function pic(p){
  if(p.img) return p.img;                    // Supabase CDN 直链
  const r=IMG[p.sku];
  if(typeof r==='string') return r;
  if(r&&r.main) return r.main;
  return ''; }
const U = { q:'', group:'', series:'', tags:[], qty:30, open:{}, cart:{}, sheet:false };

const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = v => '$'+v.toFixed(2);
const HUES = [['#E4487F','#F58BAF'],['#23B39C','#6FD9C7'],['#7C63D9','#A899EC'],['#F2A93B','#F8CB86'],['#3E8BE8','#84B9F2'],['#E2664A','#F2A28D']];
function hue(sku){ let h=0; for(const c of sku) h=(h*31+c.charCodeAt(0))>>>0; return HUES[h%HUES.length]; }

function grpsOf(p){ return (p.groups&&p.groups.length)?p.groups:[p.group||'Other']; }
function tierIndex(q){ let i=0; C.tiers.forEach((t,k)=>{ if(q>=t.qty) i=k; }); return i; }
function tierLabel(i){ const t=C.tiers[i], n=C.tiers[i+1]; return n ? `${t.qty}–${n.qty-1} pcs` : `${t.qty}+ pcs`; }

function cartRows(){ return Object.keys(U.cart).map(s=>({p:C.products.find(x=>x.sku===s), q:U.cart[s]})).filter(r=>r.p); }
function cartTotals(){
  const rows=cartRows(), units=rows.reduce((a,r)=>a+r.q,0), ti=tierIndex(Math.max(units,U.qty));
  const total=rows.reduce((a,r)=>a+r.p.prices[ti]*r.q,0);
  const kg=rows.reduce((a,r)=>a+r.p.g*r.q,0)/1000;
  const retail=rows.reduce((a,r)=>a+r.p.msrp*r.q,0);
  return {rows,units,ti,total,kg,retail};
}

function filtered(){
  const q=U.q.trim().toLowerCase();
  return C.products.filter(p=>{
    if(U.group && !grpsOf(p).includes(U.group)) return false;
    if(U.series && p.series!==U.series) return false;
    if(U.tags.length && !U.tags.every(t=>(p.tags||[]).includes(t))) return false;
    if(!q) return true;
    return (p.sku+' '+p.name+' '+p.series).toLowerCase().includes(q);
  });
}

function render(){
  const list=filtered(), ti=tierIndex(U.qty), T=cartTotals();
  const _gcount={}; C.products.forEach(p=>grpsOf(p).forEach(g=>_gcount[g]=(_gcount[g]||0)+1));
  const groupList=[...new Set(C.products.flatMap(grpsOf))].sort((a,b)=>{
    const ao=/other|其他/i.test(a), bo=/other|其他/i.test(b);
    if(ao!==bo) return ao?1:-1;              // Other 永远最后
    return (_gcount[b]||0)-(_gcount[a]||0) || a.localeCompare(b);  // 数量多的在前
  });
  const seriesList=[...new Set(C.products.filter(p=>!U.group||grpsOf(p).includes(U.group)).map(p=>p.series))].sort();

function card(p, ti){
  const [c1,c2]=hue(p.sku), inCart=U.cart[p.sku], open=U.open[p.sku];
  const off = (!isLocked() && p.msrp>0) ? Math.round((1-p.prices[ti]/p.msrp)*100) : 0;
  const src = pic(p);
  return `<div class="card">
    ${src
      ? `<div class="shotwrap"><img class="shot" src="${esc(src)}" alt="${esc(p.name)}" loading="lazy"><span class="wt">${p.gApprox?'~':''}${p.g} g</span></div>`
      : `<div class="swatch" style="background:linear-gradient(135deg,${c1},${c2})">
      <span class="init">${esc(p.sku.slice(0,2))}</span>
      <span class="wt">${p.gApprox?'~':''}${p.g} g</span>
    </div>`}
    <div class="cbody">
      <div class="cname">${esc(p.name)}</div>
      <div class="csku">${esc(p.sku)}${(p.tags||[]).length?' · '+esc((p.tags||[]).slice(0,2).join(' · ')):''}</div>
      ${isLocked()
        ? `<div class="locked"><b>Locked</b><span>· enter access code for pricing</span></div>`
        : `<div class="cprice"><b>${money(p.prices[ti])}</b><small>/ unit</small></div>
      <div class="cmsrp">MSRP ${money(p.msrp)} · <b>${off}% margin</b> for you</div>`}
      <div class="cacts">
        ${isLocked()
          ? `<button class="mini add" data-act="focuscode">Unlock pricing</button>`
          : (inCart
          ? `<span class="qty"><button data-dec="${esc(p.sku)}">−</button><input data-q="${esc(p.sku)}" value="${inCart}"><button data-inc="${esc(p.sku)}">+</button></span>`
          : `<button class="mini add" data-add="${esc(p.sku)}">Add ${C.moq}</button>`)}
        ${isLocked()?'':`<button class="mini" data-open="${esc(p.sku)}">${open?'Hide':'Tiers'}</button>`}
      </div>
    </div>
    <div class="tiers ${open&&!isLocked()?'open':''}">
      ${isLocked()?'':C.tiers.map((t,i)=>`<div class="trow ${i===ti?'hit':''}"><span>${t.qty}+ pcs</span><span>${money(p.prices[i])}</span></div>`).join('')}
    </div>
  </div>`;
}

function bind(){
  const $=s=>document.querySelectorAll(s);
  const sz=document.getElementById('sz');
  if(sz) sz.oninput=()=>{ U.qty=C.tiers[+sz.value].qty; render(); };
  $('[data-tick]').forEach(el=>el.onclick=()=>{ U.qty=C.tiers[+el.dataset.tick].qty; render(); });
  const q=document.getElementById('q');
  if(q){
    // 重绘后自动把焦点+光标还回搜索框（修复打字失焦）
    if(window._qfocus){ q.focus(); try{ const n=q.value.length; q.setSelectionRange(n,n); }catch(e){} window._qfocus=false; }
  }
  if(q && !q.dataset.bound){
    q.dataset.bound='1';
    let composing=false,t=null;
    const run=()=>{ U.q=q.value; window._qfocus=true; render(); };
    q.addEventListener('compositionstart',()=>{composing=true});
    q.addEventListener('compositionend',()=>{composing=false;run()});
    q.addEventListener('input',()=>{ if(composing) return; clearTimeout(t); t=setTimeout(run,150); });
  }
  $('[data-series]').forEach(el=>el.onclick=()=>{ U.series=el.dataset.series; U.q=''; render(); window.scrollTo({top:document.querySelector('.bar').offsetTop-4}); });
  $('[data-tag]').forEach(el=>el.onclick=()=>{
    const t=el.dataset.tag;
    if(t==='__clear') U.tags=[];
    else U.tags = U.tags.includes(t) ? U.tags.filter(x=>x!==t) : [...U.tags,t];
    render();
  });
  $('[data-group]').forEach(el=>el.onclick=()=>{ U.group=el.dataset.group; U.series=''; U.q=''; render(); window.scrollTo({top:document.querySelector('.bar').offsetTop-4}); });
  $('[data-open]').forEach(el=>el.onclick=()=>{ U.open[el.dataset.open]=!U.open[el.dataset.open]; render(); });
  $('[data-add]').forEach(el=>el.onclick=()=>{ U.cart[el.dataset.add]=C.moq; render(); });
  $('[data-inc]').forEach(el=>el.onclick=()=>{ U.cart[el.dataset.inc]+=10; render(); });
  $('[data-dec]').forEach(el=>el.onclick=()=>{ const s=el.dataset.dec; U.cart[s]=Math.max(0,U.cart[s]-10); if(!U.cart[s]) delete U.cart[s]; render(); });
  $('[data-q]').forEach(el=>el.onchange=()=>{ const v=Math.max(0,parseInt(el.value)||0); const s=el.dataset.q; if(v) U.cart[s]=v; else delete U.cart[s]; render(); });
  $('[data-act]').forEach(el=>el.onclick=()=>act(el.dataset.act));
  const ci=document.getElementById('code');
  if(ci && !ci.dataset.bound){ ci.dataset.bound='1';
    ci.addEventListener('keydown',e=>{ if(e.key==='Enter') act('unlock'); }); }
  const sh=document.querySelector('[data-sheet]');
  if(sh) sh.onclick=e=>{ if(e.target===sh){ U.sheet=false; render(); } };
}

function act(a){
  if(a==='unlock'){
    const el=document.getElementById('code'); const v=el?el.value:'';
    UNLOCKING=true; render();
    tryUnlock(v).then(msg=>{ UNLOCKING=false; UNLOCK_MSG=msg; render();
      if(!msg) window.scrollTo({top:0,behavior:'smooth'}); });
    return;
  }
  if(a==='focuscode'){ window.scrollTo({top:0,behavior:'smooth'});
    setTimeout(()=>{ const el=document.getElementById('code'); if(el) el.focus(); },350); return; }
  if(a==='lock'){ PRICES=null; U.cart={}; C.products.forEach(p=>{ delete p.prices; delete p.msrp; });
    try{ sessionStorage.removeItem('pawtoto-code'); }catch(e){} render(); return; }
  if(a==='request'){
    const body=['Hi Pawtoto team,','','I would like an access code for your wholesale pricing.','',
      'Company:','Website / storefront:','Resale certificate #:','Name:','','Thanks!'].join('\n');
    window.location.href='mailto:wholesale@pawtoto.net?subject='+encodeURIComponent('Wholesale access request')+'&body='+encodeURIComponent(body);
    return;
  }
  if(a==='clear'){ U.cart={}; U.sheet=false; render(); }
  else if(a==='review'){ U.sheet=true; render(); }
  else if(a==='closesheet'){ U.sheet=false; render(); }
  else if(a==='email'){ sendEmail(); }
}

function sendEmail(){
  if(isLocked()) return;
  const T=cartTotals();
  if(!T.rows.length) return;
  const lines=T.rows.map(r=>`${r.p.sku}  ${r.p.name}  x${r.q}  @ ${money(r.p.prices[T.ti])} = ${money(r.p.prices[T.ti]*r.q)}`);
  const body=[
    'Hi Pawtoto team,','','I would like a quote on the following:','',
    ...lines,'',
    `Total units: ${T.units}  (${tierLabel(T.ti)})`,
    `Order total: ${money(T.total)}`,
    `Estimated weight: ${T.kg.toFixed(1)} kg`,'',
    'Ship to:','Company:','Resale certificate #:','','Thanks!'
  ].join('\n');
  const to='wholesale@pawtoto.net';
  window.location.href=`mailto:${to}?subject=${encodeURIComponent('Wholesale order request — '+T.units+' pcs')}&body=${encodeURIComponent(body)}`;
}

/* ---------- load ---------- */
function bootError(msg){
  document.getElementById('root').innerHTML = `
  <div style="min-height:70vh;display:flex;align-items:center;justify-content:center;padding:30px">
    <div style="max-width:420px;text-align:center">
      <div style="font-size:42px;line-height:1;margin-bottom:14px">🐾</div>
      <h2 style="margin:0 0 8px;font-size:20px;letter-spacing:-.02em">Catalogue unavailable</h2>
      <p style="color:var(--ink-3);font-size:13px;line-height:1.6">${esc(msg)}</p>
      <button onclick="location.reload()" style="margin-top:14px;border:0;background:var(--ink);color:#fff;border-radius:999px;padding:10px 22px;font-weight:700;font-size:13px;cursor:pointer">Retry</button>
    </div>
  </div>`;
}
(async function(){
  document.getElementById('root').innerHTML =
    '<div style="min-height:60vh;display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-size:13px">Loading catalogue…</div>';
  try{
    const r = await fetch('catalog.json?t='+Date.now(), {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    C = await r.json();
  }catch(e){
    bootError('We could not load the product data. If you opened this file directly from your computer, please use the web address instead.');
    return;
  }
  U.qty = C.moq || 30;
  if(C.gated){ try{ const saved=sessionStorage.getItem('pawtoto-code'); if(saved) await tryUnlock(saved); }catch(e){} }
  render();
  // 老数据兼容：catalog 里没有 img 时再去读 images.json
  if(C.products.some(p=>!p.img)){
    try{ const ri=await fetch('images.json?t='+Date.now(),{cache:'no-store'});
      if(ri.ok){ IMG=await ri.json(); render(); } }catch(e){}
  }
})();
</script>
</body>
